name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend-cd.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: starter/frontend/package-lock.json

      - name: Install dependencies
        working-directory: starter/frontend
        run: npm ci

      - name: Run lint
        working-directory: starter/frontend
        run: npm run lint

      - name: Run tests
        working-directory: starter/frontend
        run: CI=true npm test -- --watchAll=false

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          MOVIE_API_URL: http://a159050680d0047bfb52651cdf2f097d-1730096371.us-east-1.elb.amazonaws.com
        run: |
          docker build --build-arg REACT_APP_MOVIE_API_URL=$MOVIE_API_URL -t $REGISTRY/frontend:${{ github.sha }} -t $REGISTRY/frontend:latest starter/frontend
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/frontend:${{ github.sha }} -t $REGISTRY/frontend:latest starter/frontend
          docker push $REGISTRY/frontend:${{ github.sha }}
          docker push $REGISTRY/frontend:latest

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Deploy frontend
        run: |
          kubectl apply -k starter/frontend/k8s
          kubectl set image deployment/frontend frontend=647038750271.dkr.ecr.us-east-1.amazonaws.com/frontend:${{ github.sha }}
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Get frontend service
        run: kubectl get service frontend